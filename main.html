}

// ── BRL number parser (separator-agnostic) ────────────────────────────────
// Works regardless of whether OCR output commas vs periods: uses the
// NUMBER OF DIGITS after the last separator to determine its role.
//   • 2 trailing digits  → last sep is the decimal separator  (BRL: comma)
//   • 3 trailing digits  → last sep is a thousands separator  (no cents)
//   • 0 separators       → plain integer price
function _parseBRL(s) {
  s = (s || '').replace(/[^0-9.,]/g, '');
  if (!s) return null;
  const seps = [...s.matchAll(/[.,]/g)];
  if (!seps.length) {
    const n = parseFloat(s);
    return (isFinite(n) && n > 0) ? n : null;
  }
  const lastSep = seps[seps.length - 1];
  const after   = s.slice(lastSep.index + 1);
  let norm;
  if (after.length === 2) {
    // Last separator is the decimal point (BRL uses comma, but OCR may output period)
    norm = s.slice(0, lastSep.index).replace(/[.,]/g, '') + '.' + after;
  } else {
    // All separators are thousands — no fractional part
    norm = s.replace(/[.,]/g, '');
  }
  const n = parseFloat(norm);
  return (isFinite(n) && n > 0) ? n : null;
}
