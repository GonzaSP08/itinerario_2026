<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;

    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;
    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
  .twk-chip>span>i:first-child{box-shadow:none}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  .twk-row{display:flex;flex-direction:column;gap:5px}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = { x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)), y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)) };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right, startBottom = window.innerHeight - r.bottom;
    const move = (ev) => { offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) }; clampToViewport(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" style={{ appearance: 'none', width: 56, height: 22, border: '.5px solid rgba(0,0,0,.1)', borderRadius: 6, padding: 0, cursor: 'default', background: 'transparent', flexShrink: 0 }} value={value} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <div className="twk-row"><div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" data-on={on ? '1' : '0'} style={{ background: hero }} onClick={() => onChange(o)}>
              {rest.slice(0, 4).length > 0 && <span>{rest.slice(0, 4).map((c, j) => <i key={j} style={{ background: c }} />)}</span>}
              {on && <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke={(() => { const h = String(hero).replace('#',''); const x = h.length===3?h.replace(/./g,c=>c+c):h.padEnd(6,'0'); const n=parseInt(x.slice(0,6),16); if(Number.isNaN(n))return'rgba(0,0,0,.78)'; const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return r*299+g*587+b*114>148000?'rgba(0,0,0,.78)':'#fff'; })()} /></svg>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakToggle, TweakColor });
</script>

// ─── Countdown ────────────────────────────────────────────────
function getDaysUntil(dateStr) {
  const [day, month, year] = dateStr.split('.');
  const target = new Date(Number(year), Number(month) - 1, Number(day));
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
  return diff;
}

function TransportActions({ query, T, accent, airbnbUrl, mapsUrl, bookingUrl }) {
  const enc = encodeURIComponent(query);
  const maps = mapsUrl || `https://www.google.com/maps/search/?api=1&query=${enc}`;

  // Extract lat/lng from mapsUrl when available for more precise deep links
  const coordMatch = mapsUrl && mapsUrl.match(/query=([-\d.]+)%2C([-\d.]+)/);
  const lat = coordMatch ? coordMatch[1] : null;
  const lng = coordMatch ? coordMatch[2] : null;

  const uber = lat && lng
    ? `https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Bformatted_address%5D=${enc}&dropoff%5Blatitude%5D=${lat}&dropoff%5Blongitude%5D=${lng}`
    : `https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff%5Bformatted_address%5D=${enc}`;

  const cabifyScheme = lat && lng
    ? `cabify://route/new?stops[0][loc]=${lat},${lng}&stops[0][label]=${enc}`
    : null;
  const cabifyWeb = `https://cabify.com/es/cities`;

  const handleCabify = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (cabifyScheme) {
      window.location.href = cabifyScheme;
      setTimeout(() => window.open(cabifyWeb, '_blank'), 1800);

      window.open(cabifyWeb, '_blank');
    }
  };

  const Chip = ({ href, label, icon, color, onClick: onChipClick }) => (
    <a
      href={href} target="_blank" rel="noopener noreferrer"
      onClick={onChipClick || ((e) => e.stopPropagation())}
      style={{ flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, padding: '10px 8px', borderRadius: 10, border: `1px solid ${fade(T, 0.14)}`, background: 'transparent', color: T.fg, textDecoration: 'none', fontFamily: 'Nunito, system-ui, sans-serif', fontSize: 10, letterSpacing: '0.06em', textTransform: 'uppercase', transition: 'border-color .15s ease, background .15s ease' }}
      onMouseEnter={(e) => { e.currentTarget.style.borderColor = color; e.currentTarget.style.background = `${color}1f`; }}
      onMouseLeave={(e) => { e.currentTarget.style.borderColor = fade(T, 0.14); e.currentTarget.style.background = 'transparent'; }}
    >
      {icon}<span>{label}</span>
    </a>
  );

  const uberColor = T.dark ? 'ffffff' : '000000';

  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
        <Mono style={{ fontSize: 9, color: fade(T, 0.6), textTransform: 'uppercase', letterSpacing: '0.12em' }}>Cómo llegar</Mono>
        <Mono style={{ fontSize: 9, color: fade(T, 0.3), letterSpacing: '0.04em' }}>{query.length > 28 ? query.slice(0, 28) + '…' : query}</Mono>

// ─── Card shell ───────────────────────────────────────────────
function FadeIn({ children, delay = 0 }) {
  const ref = React.useRef(null);
  const [vis, setVis] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setVis(true); obs.unobserve(el); } },
      { threshold: 0.05, rootMargin: '0px 0px -16px 0px' }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ opacity: vis ? 1 : 0, transform: vis ? 'translateY(0)' : 'translateY(12px)', transition: `opacity 0.38s ease ${delay}ms, transform 0.38s ease ${delay}ms` }}>
      {children}
    </div>
  );
}

function Card({ children, onClick, expanded, accent, T }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div
      onClick={onClick}

      style={{
        margin: '0 16px 10px', background: T.cardBg,
        border: `1px solid ${expanded ? `${accent}88` : hovered ? `${accent}44` : fade(T, 0.08)}`,
        borderRadius: 12, padding: '18px 18px 16px', cursor: 'pointer',
        boxShadow: expanded ? `0 8px 24px ${fade(T, 0.1)}` : hovered ? `0 4px 16px ${fade(T, 0.07)}` : `0 1px 8px ${fade(T, 0.04)}`,
        transform: hovered && !expanded ? 'translateY(-2px)' : 'none',
        transition: 'border-color .18s ease, box-shadow .18s ease, transform .18s ease',
      }}
    >
      {children}
    </div>
  );
}

const RAPIDAPI_KEY = '946fd9d12emshf418dd7e5b9640bp1e42d9jsnde9231ca503b';

const FLIGHT_STATUS_LABELS = {
  Expected:  { label: 'Programado', tone: 'neutral' },
  EnRoute:   { label: 'En vuelo',   tone: 'accent'  },
  Landed:    { label: 'Aterrizado', tone: 'ok'      },
  Cancelled: { label: 'Cancelado',  tone: 'warn'    },
  Delayed:   { label: 'Demorado',   tone: 'warn'    },
};

function fetchFlightStatus(f) {
  return fetch(
    `https://aerodatabox.p.rapidapi.com/flights/Number/${f.flightNumber}/${f.isoDate}`,
    { headers: { 'x-rapidapi-host': 'aerodatabox.p.rapidapi.com', 'x-rapidapi-key': RAPIDAPI_KEY } }
  )
    .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e?.message || `HTTP ${r.status}`)))
    .then(json => ({ id: f.id, data: Array.isArray(json) ? json[0] : null, error: null }))
    .catch(err  => ({ id: f.id, data: null, error: String(err) }));
}

function localTime(isoStr) {
  if (!isoStr) return null;
  const match = isoStr.match(/(\d{2}:\d{2})[-+]/);
  return match ? match[1] : null;
}

// ─── Refresh button ───────────────────────────────────────────
function RefreshBtn({ onRefresh, T, accent }) {
  const [btnState, setBtnState] = useState('idle'); // idle | loading | done

  const handleClick = (e) => {
    e.stopPropagation();
    if (btnState !== 'idle') return;
    setBtnState('loading');
    onRefresh().then(() => {
      setBtnState('done');
      setTimeout(() => setBtnState('idle'), 2200);
    });
  };

  const tealFg = T.dark ? '#7fc8cb' : '#0E6B70';
  const color  = btnState === 'done' ? tealFg : fade(T, btnState === 'loading' ? 0.25 : 0.45);

  return (
    <button
      onClick={handleClick}
      disabled={btnState !== 'idle'}
      title="Actualizar estado"
      style={{
        width: 26, height: 26, borderRadius: 99, border: `1px solid ${fade(T, 0.12)}`,
        background: btnState === 'done' ? `${tealFg}18` : 'transparent',
        cursor: btnState === 'idle' ? 'pointer' : 'default',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 0, color, flexShrink: 0,
        transition: 'border-color .2s, background .2s, color .2s',
      }}

      {btnState === 'done' ? (
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"

  );
}

const DIAS_ES  = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MESES_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fmtDay(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return { dow: DIAS_ES[dt.getDay()], d, mon: MESES_ES[m - 1] };
}
function wmoInfo(code) {
  if (code === 0)         return { label: 'Despejado',            type: 'sun' };
  if (code <= 2)          return { label: 'Parcialmente nublado', type: 'partly' };
  if (code === 3)         return { label: 'Nublado',              type: 'cloud' };
  if (code <= 48)         return { label: 'Niebla',               type: 'fog' };
  if (code <= 55)         return { label: 'Llovizna',             type: 'drizzle' };
  if (code <= 67)         return { label: 'Lluvia',               type: 'rain' };
  if (code <= 82)         return { label: 'Chubascos',            type: 'rain' };
  if (code <= 99)         return { label: 'Tormenta',             type: 'storm' };
  return                         { label: 'Variable',             type: 'partly' };
}
function WeatherIcon({ code, size = 26 }) {
  const w = { width: size, height: size, viewBox: '0 0 24 24', fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round' };
  const cloudPath = 'M17.5 11.5h-.84A6 6 0 1 0 8 18h9.5a3.5 3.5 0 1 0 0-7';

      <circle cx="12" cy="12" r="4" fill="#F0C030"/>

  if (code <= 2) return (
    <svg {...w}>
      <circle cx="8" cy="9" r="3" fill="#F0C030"/>
      <path stroke="#F0C030" strokeWidth="1.5" d="M8 4.5V6M8 12v1.5M3.5 9H5M11 9h1.5M5.05 6.05l1.06 1.06M9.89 10.89l1.06 1.06M5.05 11.95l1.06-1.06"/>
      <path d="M19 13.5h-.8A5 5 0 1 0 10 18.5h9a3 3 0 0 0 0-6" fill="#9DAFC0"/>
    </svg>
  );
  if (code === 3) return (
    <svg {...w}><path d={cloudPath} fill="#9DAFC0"/></svg>
  );
  if (code <= 48) return (
    <svg {...w} stroke="#9DAFC0" strokeWidth="1.8">
      <path d="M4 6h16M4 10h14M4 14h12M4 18h9"/>
    </svg>
  );
  const cloud = <path d={cloudPath} fill="#9DAFC0"/>;
  if (code <= 55) return (
    <svg {...w}>{cloud}<path stroke="#5B9BD5" strokeWidth="1.8" d="M10 21l-.5 2M13 21l-.5 2"/></svg>
  );
  if (code >= 95) return (

  );
}

function WeatherContent({ T, accent }) {
  const [weather, setWeather] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [activeCity, setActiveCity] = React.useState('posadas');
  const [lastUpdate, setLastUpdate] = React.useState(null);
  const [expandedDay, setExpandedDay] = React.useState(null);
  const [hourlyCache, setHourlyCache] = React.useState({});
  const [hourlyLoading, setHourlyLoading] = React.useState(false);

  const fetchAll = React.useCallback(() => {
    setLoading(true);
    setExpandedDay(null);
    Promise.all(WEATHER_CITIES.map(city =>
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode,windspeed_10m_max&timezone=${encodeURIComponent(city.tz)}&forecast_days=14`)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(json => ({ id: city.id, daily: json.daily }))
        .catch(() => ({ id: city.id, daily: null }))
    )).then(results => {
      const map = {};
      results.forEach(r => { map[r.id] = r.daily; });
      setWeather(map);
      setLoading(false);
      setLastUpdate(new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }));
    });
  }, []);

  React.useEffect(() => { fetchAll(); }, []);

  React.useEffect(() => {
    if (expandedDay === null) return;
    const daily = weather[activeCity];
    if (!daily) return;
    const iso = daily.time[expandedDay];
    const cacheKey = `${activeCity}-${iso}`;
    if (hourlyCache[cacheKey] !== undefined) return;
    const city = WEATHER_CITIES.find(c => c.id === activeCity);
    setHourlyLoading(true);
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m,apparent_temperature,precipitation_probability,weathercode&timezone=${encodeURIComponent(city.tz)}&start_date=${iso}&end_date=${iso}`)
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(json => {
        const slots = [];
        for (let h = 0; h < 24; h += 3) {
          slots.push({
            time: `${String(h).padStart(2, '0')}:00`,
            temp: Math.round(json.hourly.temperature_2m[h] ?? 0),
            feels: Math.round(json.hourly.apparent_temperature[h] ?? 0),
            precip: json.hourly.precipitation_probability[h] ?? 0,
            code: json.hourly.weathercode[h] ?? 0,
          });
        }
        setHourlyCache(prev => ({ ...prev, [cacheKey]: slots }));
        setHourlyLoading(false);
      })
      .catch(() => {
        setHourlyCache(prev => ({ ...prev, [cacheKey]: [] }));
        setHourlyLoading(false);
      });
  }, [expandedDay, activeCity]);

  const daily = weather[activeCity];

  return (
    <div>
      <div style={{ padding: '0 16px 12px', display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
        {WEATHER_CITIES.map(city => {
          const on = city.id === activeCity;
          return (
            <button key={city.id} onClick={() => { setActiveCity(city.id); setExpandedDay(null); }} style={{
              padding: '6px 14px', borderRadius: 99,
              border: `1px solid ${on ? accent : fade(T, 0.14)}`,
              background: on ? `${accent}18` : 'transparent',
              color: on ? accent : fade(T, 0.72),
              fontFamily: 'Nunito, system-ui, sans-serif',
              fontSize: 11, fontWeight: on ? 700 : 500,
              letterSpacing: '0.04em', cursor: 'pointer',
              transition: 'all .15s ease',
            }}>{city.label}</button>
          );
        })}
        <button onClick={fetchAll} style={{
          marginLeft: 'auto', background: 'transparent',
          border: `1px solid ${fade(T, 0.12)}`, borderRadius: 8,
          width: 30, height: 30, cursor: 'pointer', color: accent,
          fontFamily: 'Nunito, system-ui, sans-serif', fontSize: 15, fontWeight: 700,
          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
        }}>
          {loading ? '·' : '↻'}
        </button>
      </div>

      {loading && (
        <div style={{ padding: '40px 16px', textAlign: 'center' }}>
          <Mono style={{ fontSize: 11, color: fade(T, 0.35) }}>Cargando pronóstico...</Mono>
        </div>
      )}

      {!loading && !daily && (
        <div style={{ margin: '0 16px', padding: '32px', textAlign: 'center', background: T.cardBg, borderRadius: 12, border: `1px solid ${fade(T, 0.07)}` }}>
          <Mono style={{ fontSize: 11, color: fade(T, 0.45) }}>No se pudo obtener el pronóstico.</Mono>
          <button onClick={fetchAll} style={{ marginTop: 12, background: accent, border: 'none', borderRadius: 8, padding: '8px 16px', color: '#fff', fontFamily: 'Nunito', fontSize: 11, fontWeight: 700, cursor: 'pointer', display: 'block', margin: '12px auto 0' }}>
            Reintentar
          </button>
        </div>
      )}

      {!loading && daily && (
        <div style={{ margin: '0 16px' }}>
          <div style={{ background: T.cardBg, borderRadius: 12, border: `1px solid ${fade(T, 0.07)}`, overflow: 'hidden', boxShadow: `0 2px 12px ${fade(T, 0.05)}` }}>
            {daily.time.map((iso, i) => {
              const { dow, d, mon } = fmtDay(iso);
              const info = wmoInfo(daily.weathercode[i]);
              const tmax = Math.round(daily.temperature_2m_max[i]);
              const tmin = Math.round(daily.temperature_2m_min[i]);
              const precip = daily.precipitation_sum[i] ?? 0;
              const isLast = i === daily.time.length - 1;
              const isOpen = expandedDay === i;
              const maxColor = tmax >= 30 ? '#E8602C' : tmax >= 24 ? accent : '#2A5298';
              const cacheKey = `${activeCity}-${iso}`;
              const slots = hourlyCache[cacheKey];
              return (
                <FadeIn key={iso} delay={i * 18}>
                  <div style={{ borderBottom: isLast && !isOpen ? 'none' : `1px solid ${fade(T, 0.06)}` }}>
                    <div
                      onClick={() => setExpandedDay(isOpen ? null : i)}
                      style={{
                        display: 'flex', alignItems: 'center', padding: '10px 16px', gap: 10,
                        background: isOpen ? `${accent}0d` : i % 2 === 0 ? 'transparent' : fade(T, 0.015),
                        cursor: 'pointer', userSelect: 'none',
                        transition: 'background .15s ease',
                      }}
                    >
                      <div style={{ width: 44, flexShrink: 0 }}>
                        <Mono style={{ fontSize: 11, fontWeight: 700, color: isOpen ? accent : T.fg, display: 'block', letterSpacing: '0.02em' }}>{dow}</Mono>
                        <Mono style={{ fontSize: 9, color: fade(T, 0.5), display: 'block', marginTop: 1 }}>{d} {mon}</Mono>
                      </div>
                      <div style={{ width: 30, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <WeatherIcon code={daily.weathercode[i]} size={24} />
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <Mono style={{ fontSize: 10, color: fade(T, 0.68), display: 'block', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{info.label}</Mono>
                        {precip > 0.1 && (
                          <Mono style={{ fontSize: 9, color: '#5B9BD5', display: 'block', marginTop: 1 }}>{precip.toFixed(1)} mm</Mono>
                        )}
                      </div>
                      <div style={{ flexShrink: 0, textAlign: 'right', display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div>
                          <Mono style={{ fontSize: 14, fontWeight: 800, color: maxColor, display: 'inline' }}>{tmax}°</Mono>
                          <Mono style={{ fontSize: 11, color: fade(T, 0.42), display: 'inline' }}> / {tmin}°</Mono>
                        </div>
                        <Mono style={{ fontSize: 10, color: isOpen ? accent : fade(T, 0.35), display: 'inline-block', transform: isOpen ? 'rotate(180deg)' : 'none', transition: 'transform .2s' }}>▾</Mono>
                      </div>
                    </div>

                    {isOpen && (
                      <div style={{ padding: '0 12px 14px' }}>
                        {(hourlyLoading && !slots) ? (
                          <div style={{ display: 'flex', gap: 8, paddingTop: 10 }}>
                            {[0,1,2,3,4,5,6,7].map(j => (
                              <div key={j} style={{ minWidth: 52, height: 82, borderRadius: 10, background: fade(T, 0.07), animation: `pulse 1.4s ease ${j * 0.08}s infinite`, flexShrink: 0 }} />
                            ))}
                          </div>
                        ) : slots && slots.length > 0 ? (
                          <div style={{ overflowX: 'auto', scrollbarWidth: 'none' }}>
                            <div style={{ display: 'flex', gap: 8, paddingTop: 10, minWidth: 'max-content' }}>
                              {slots.map(slot => {
                                const tColor = slot.temp >= 30 ? '#E8602C' : slot.temp >= 24 ? accent : '#2A5298';
                                return (
                                  <div key={slot.time} style={{
                                    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                                    background: fade(T, 0.04), borderRadius: 10, padding: '8px 10px', minWidth: 52,
                                    border: `1px solid ${fade(T, 0.06)}`,
                                  }}>
                                    <Mono style={{ fontSize: 9, color: fade(T, 0.5), fontWeight: 600 }}>{slot.time}</Mono>
                                    <WeatherIcon code={slot.code} size={18} />
                                    <Mono style={{ fontSize: 13, fontWeight: 800, color: tColor }}>{slot.temp}°</Mono>
                                    {slot.precip > 0 ? (
                                      <Mono style={{ fontSize: 9, color: '#5B9BD5', fontWeight: 600 }}>{slot.precip}%</Mono>
                                    ) : (
                                      <div style={{ height: 14 }} />
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        ) : slots && slots.length === 0 ? (
                          <Mono style={{ fontSize: 10, color: fade(T, 0.4), padding: '12px 4px', display: 'block' }}>No disponible</Mono>
                        ) : null}
                      </div>
                    )}
                  </div>
                </FadeIn>
              );
            })}
          </div>
          {lastUpdate && (
            <Mono style={{ display: 'block', fontSize: 9, color: fade(T, 0.3), textAlign: 'center', marginTop: 8, letterSpacing: '0.05em' }}>
              Actualizado {lastUpdate}
            </Mono>
          )}
        </div>
      )}
    </div>
  );
}

function FilterBar({ filters, active: activeFilters, onToggle, accent, T }) {
  return (
    <div style={{ padding: '0 16px 14px', display: 'flex', gap: 6, flexWrap: 'wrap' }}>
      {filters.map(({ key, label, color }) => {
        const on = activeFilters.includes(key);
        return (
          <button
            key={key}
            onClick={() => onToggle(key)}
            style={{
              padding: '6px 12px', borderRadius: 99,
              border: `1px solid ${on ? (color || accent) : fade(T, 0.14)}`,
              background: on ? `${color || accent}18` : 'transparent',
              color: on ? (color || accent) : fade(T, 0.75),
              fontFamily: 'Nunito, system-ui, sans-serif',
              fontSize: 11, fontWeight: on ? 700 : 500,
              letterSpacing: '0.04em', cursor: 'pointer',
              transition: 'all .15s ease',
            }}
          >
            {label}
          </button>
        );
      })}
    </div>
  );
}

function SectionSkeleton({ T }) {
  return (
    <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
      {[0, 1, 2, 3].map(i => (
        <div key={i} style={{
          borderRadius: 14,
          background: fade(T, 0.07),
          animation: `pulse 1.4s ease ${i * 0.1}s infinite`,
          height: i === 0 ? 80 : 68,
        }} />
      ))}
    </div>
  );
}

// ─── Section content ──────────────────────────────────────────
function SectionContent({ active, accent, expanded, toggleExpand, T }) {
  const [cityFilter, setCityFilter] = useState(['São Paulo']);
  const [catFilter,  setCatFilter]  = useState([]);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    setCityFilter(['São Paulo']);
    setCatFilter([]);
    setReady(false);
    const t = setTimeout(() => setReady(true), 220);
    return () => clearTimeout(t);
  }, [active]);

  // Flight statuses — keyed by flight id, null = still loading
  const [flightStatuses, setFlightStatuses] = useState({});

  useEffect(() => {
    if (active !== 'vuelos') return;
    setFlightStatuses({});
    Promise.all(FLIGHTS.map(fetchFlightStatus)).then(results => {
      const allHaveData = results.every(r => r.data != null);
      const map = {};
      results.forEach(r => {
        map[r.id] = allHaveData
          ? { data: r.data, error: r.error }
          : { data: null, error: null };
      });
      setFlightStatuses(map);
    });
  }, [active]);

  const handleRefreshFlight = (flightId) => {
    const f = FLIGHTS.find(fl => fl.id === flightId);
    return fetchFlightStatus(f).then(result => {
      setFlightStatuses(prev => ({
        ...prev,
        [flightId]: { data: result.data, error: result.error },
      }));
    });
  };

  const selectCity = (city) => setCityFilter(prev => prev.length === 1 && prev[0] === city ? [] : [city]);
  const toggleCat  = (cat)  => setCatFilter(f =>  f.includes(cat)  ? f.filter(c => c !== cat)  : [...f, cat]);

  const cityFilters = CITIES.map(c => ({ key: c, label: c }));
  const catFilters  = MEAL_CATEGORIES.map(c => ({
    key: c, label: c,
    color: c === 'Restaurante' ? '#E8602C' : c === 'Bar' ? '#2A5298' : '#0E6B70',
  }));

  const filterByCity = (items) => cityFilter.length === 0 ? items : items.filter(i => cityFilter.includes(i.city));
  const filterByCat  = (items) => catFilter.length  === 0 ? items : items.filter(i => catFilter.includes(i.category));

  const idx = SECTIONS.findIndex(s => s.id === active) + 1;
  const total = SECTIONS.length;
  const titles = {
    vuelos:        { title: 'Vuelos',        hint: 'GOL · 3 tramos' },
    alojamientos:  { title: 'Alojamientos',  hint: '4 estadías · 12 noches' },
    actividades:   { title: 'Actividades',   hint: '20 por ciudad · SP & RJ' },
    museos:        { title: 'Museos',        hint: '10 por ciudad · SP & RJ' },
    shoppings:     { title: 'Shoppings',     hint: '10 por ciudad · SP & RJ' },
    comidas:       { title: 'Comidas',       hint: '10 por categoría · SP & RJ' },
    clima:         { title: 'Clima',         hint: 'Pronóstico 14 días · 4 ciudades' },
  }[active];

  const props = (id) => ({ expanded: expanded === id, onToggle: () => toggleExpand(id), accent, T });

  const visibleCities = cityFilter.length > 0 ? CITIES.filter(c => cityFilter.includes(c)) : CITIES;

  const GroupedSection = ({ data, Card: CardComp, cardProp }) => (
    <>
      <FilterBar filters={cityFilters} active={cityFilter} onToggle={selectCity} accent={accent} T={T} />
      {visibleCities.map(city => {
        const items = data.filter(x => x.city === city)
          .sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
        if (items.length === 0) return <EmptyFilter key={city} T={T} />;
        return (
          <div key={city}>
            <CityGroupHeader city={city} acts={items} T={T} accent={accent} />
            {items.map((item, i) => (
              <FadeIn key={item.id} delay={i * 35}>
                <CardComp {...{ [cardProp]: item }} {...props(item.id)} />
              </FadeIn>
            ))}
          </div>
        );
      })}
    </>
  );

  return (
    <div key={active} style={{ animation: 'fadein .35s ease', paddingTop: 20 }}>
      <SectionCaption index={idx} total={total} title={titles.title} hint={titles.hint} T={T} accent={accent} />

      {!ready && <SectionSkeleton T={T} />}
      {ready && active === 'vuelos' && FLIGHTS.map((f, i) => (
        <FadeIn key={f.id} delay={i * 60}>
          <FlightCard f={f} liveStatus={flightStatuses[f.id] ?? null} onRefresh={() => handleRefreshFlight(f.id)} {...props(f.id)} />
        </FadeIn>
      ))}
      {ready && active === 'alojamientos' && STAYS.map((s, i) => (
        <FadeIn key={s.id} delay={i * 60}>
          <StayCard s={s} {...props(s.id)} />
        </FadeIn>
      ))}
      {ready && active === 'actividades' && (
        <>
          <FilterBar filters={cityFilters} active={cityFilter} onToggle={selectCity} accent={accent} T={T} />
          {visibleCities.map(city => {
            const acts = ACTIVITIES.filter(a => a.city === city)
              .sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            if (acts.length === 0) return <EmptyFilter key={city} T={T} />;
            return (
              <div key={city}>
                <CityGroupHeader city={city} acts={acts} T={T} accent={accent} />
                {acts.map((a, i) => (
                  <FadeIn key={a.id} delay={i * 35}>
                    <ActivityRow a={a} {...props(a.id)} />
                  </FadeIn>
                ))}
              </div>
            );
          })}
        </>
      )}
      {ready && active === 'museos'    && <GroupedSection data={MUSEUMS}   Card={MuseumCard}   cardProp="m" />}
      {ready && active === 'shoppings' && <GroupedSection data={SHOPPINGS} Card={ShoppingCard} cardProp="s" />}
      {ready && active === 'comidas' && (
        <>
          <FilterBar filters={cityFilters} active={cityFilter} onToggle={selectCity} accent={accent} T={T} />
          <FilterBar filters={catFilters} active={catFilter} onToggle={toggleCat} accent={accent} T={T} />
          {visibleCities.map(city => {
            const meals = (catFilter.length === 0 ? MEALS : MEALS.filter(m => catFilter.includes(m.category)))
              .filter(m => m.city === city)
              .sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            if (meals.length === 0) return <EmptyFilter key={city} T={T} />;
            return (
              <div key={city}>
                <CityGroupHeader city={city} acts={meals} T={T} accent={accent} />
                {meals.map((m, i) => (
                  <FadeIn key={m.id} delay={i * 50}>
                    <MealCard m={m} {...props(m.id)} />
                  </FadeIn>
                ))}
              </div>
            );
          })}
        </>
      )}
      {ready && active === 'clima' && <WeatherContent T={T} accent={accent} />}
    </div>
  );
}

function EmptyFilter({ T }) {
  return (
    <div style={{ padding: '32px 22px', textAlign: 'center' }}>
      <Mono style={{ fontSize: 11, color: fade(T, 0.35), letterSpacing: '0.08em' }}>Sin resultados para este filtro</Mono>
    </div>
  );
}

function Footer({ accent, T }) {
  const [rates, setRates] = React.useState(null);
  const [rateDate, setRateDate] = React.useState(null);

  React.useEffect(() => {
    fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/brl.json')

  return (
    <div style={{ padding: '32px 22px 40px', textAlign: 'center' }}>

        Boa viagem.
      </Serif>
      <Mono style={{ display: 'block', marginTop: 10, fontSize: 9, color: fade(T, 0.35), letterSpacing: '0.16em', textTransform: 'uppercase' }}>
        Para Ale ❤️
      </Mono>
      <div style={{ height: 24 }} />
      {rates ? (
        <div>
          <Mono style={{ fontSize: 11, color: fade(T, 0.55), letterSpacing: '0.04em' }}>
            1 R$ 🇧🇷 &nbsp;=&nbsp; {fmtUSD(rates.usd)} USD 🇺🇸 &nbsp;=&nbsp; $ {fmtARS(rates.ars)} 🇦🇷
          </Mono>
          {rateDate && (
            <Mono style={{ display: 'block', marginTop: 5, fontSize: 9, color: fade(T, 0.25), letterSpacing: '0.08em' }}>
              {rateDate}
            </Mono>
          )}
        </div>
      ) : (
        <Mono style={{ fontSize: 9, color: fade(T, 0.2), letterSpacing: '0.1em' }}>···</Mono>
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
const TWEAK_DEFAULTS = { "dark": false, "accent": "#0E6B70", "showHero": true };

// ─── Login screen ─────────────────────────────────────────────
const OTP_COOLDOWN_S  = 60; // segundos entre envíos
const OTP_MAX_SENDS   = 3;  // máximo de envíos por sesión

function LoginScreen({ onAuth }) {
  const T = makeTheme(false);
  const [step, setStep]         = React.useState('idle');
  const [code, setCode]         = React.useState('');
  const [otpStore, setOtpStore] = React.useState(null);
  const [errMsg, setErrMsg]     = React.useState('');
  const [attempts, setAttempts] = React.useState(0);
  const [sends, setSends]       = React.useState(0);
  const [cooldown, setCooldown] = React.useState(0); // segundos restantes
  const inputRef  = React.useRef(null);
  const timerRef  = React.useRef(null);

  // Countdown tick
  React.useEffect(() => {
    if (cooldown <= 0) return;
    timerRef.current = setTimeout(() => setCooldown(c => c - 1), 1000);
    return () => clearTimeout(timerRef.current);
  }, [cooldown]);

  const masked = AUTH_EMAIL.replace(/^(.{2})(.+?)(@.+)$/, (_, a, b, c) => a + b.replace(/./g, '·') + c);

  const canSend = cooldown === 0 && sends < OTP_MAX_SENDS && step !== 'sending';

  const sendOtp = async () => {
    if (!canSend) return;
    setStep('sending');
    setErrMsg('');
    const otp = String(Math.floor(100000 + Math.random() * 900000));
    try {
      await window.emailjs.send(
        EMAILJS_SVC_ID, EMAILJS_TPL_ID,
        { to_email: AUTH_EMAIL, otp_code: otp, app_name: 'Itinerario Brasil 2026' },
        { publicKey: EMAILJS_PUB_KEY }
      );
      setOtpStore({ otp, expires: Date.now() + OTP_TTL_MS });
      setSends(s => s + 1);
      setCooldown(OTP_COOLDOWN_S);
      setStep('sent');
      setAttempts(0);
      setTimeout(() => inputRef.current?.focus(), 80);
    } catch {
      setStep('idle');
      setErrMsg('No se pudo enviar el código. Verificá la config de EmailJS.');
    }
  };

  const verify = () => {
    if (!otpStore) return;
    if (Date.now() > otpStore.expires) {
      setErrMsg('El código expiró. Solicitá uno nuevo.');
      setStep('idle'); setCode(''); return;
    }
    if (code === otpStore.otp) {
      sessionStorage.setItem('_itAuth', JSON.stringify({ verified: true, expires: Date.now() + SESSION_TTL_MS }));
      setStep('success');
      setTimeout(onAuth, 2000);
    } else {
      const n = attempts + 1;
      setAttempts(n);
      if (n >= 3) {
        setErrMsg('Demasiados intentos. Solicitá un nuevo código.');
        setStep('idle'); setCode('');
      } else {
        setErrMsg(`Código incorrecto · ${3 - n} intento${3 - n === 1 ? '' : 's'} restante${3 - n === 1 ? '' : 's'}`);
      }
    }
  };

  const btnStyle = (active) => ({
    width: '100%', padding: '13px', border: 'none', borderRadius: 10,
    background: active ? '#0E6B70' : fade(T, 0.09),
    color: active ? '#fff' : fade(T, 0.3),
    fontFamily: 'Nunito, system-ui, sans-serif', fontSize: 13, fontWeight: 700,
    cursor: active ? 'pointer' : 'default', letterSpacing: '0.04em',
    transition: 'background .15s ease, color .15s ease',
  });

  if (step === 'success') return (
    <div style={{ position: 'fixed', inset: 0, background: T.bg, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', animation: 'fadeout 0.5s ease 1.5s forwards' }}>
      <DecoDots T={T} />
      <div style={{ textAlign: 'center', position: 'relative', zIndex: 1, animation: 'fadein 0.6s ease' }}>
        <Serif style={{ fontSize: 86, color: T.fg, fontStyle: 'italic', letterSpacing: '-0.025em', display: 'block', lineHeight: 0.95 }}>
          Brasil
        </Serif>
        <AlinesBar style={{ marginTop: 16 }} />
        <div style={{ display: 'flex', justifyContent: 'center', gap: 6, marginTop: 22 }}>
          {[0, 1, 2].map(i => (
            <div key={i} style={{ width: 6, height: 6, borderRadius: '50%', background: '#0E6B70', animation: `pulse 1.2s ease ${i * 0.2}s infinite` }} />
          ))}
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ minHeight: '100vh', background: T.bg, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, fontFamily: 'Nunito, system-ui, sans-serif', position: 'relative', overflow: 'hidden' }}>
      <DecoDots T={T} />
      <div style={{ width: '100%', maxWidth: 360, position: 'relative', zIndex: 1 }}>


        {/* Card */}
        <div style={{ background: T.cardBg, borderRadius: 16, padding: '28px 24px', border: `1px solid ${fade(T, 0.08)}`, boxShadow: `0 8px 32px ${fade(T, 0.07)}` }}>

          {(step === 'idle') && (<>
            <Mono style={{ display: 'block', fontSize: 12, fontWeight: 700, color: T.fg, marginBottom: 6, letterSpacing: '0.04em', textTransform: 'uppercase' }}>Acceso privado</Mono>
            <Mono style={{ display: 'block', fontSize: 11, color: fade(T, 0.58), lineHeight: 1.6, marginBottom: 20 }}>
              Se enviará un código de 6 dígitos a<br /><span style={{ color: T.fg, fontWeight: 700 }}>{masked}</span>
            </Mono>
            {errMsg && <Mono style={{ display: 'block', fontSize: 11, color: '#E8602C', marginBottom: 12, lineHeight: 1.5 }}>{errMsg}</Mono>}
            {sends >= OTP_MAX_SENDS
              ? <Mono style={{ display: 'block', fontSize: 11, color: '#E8602C', textAlign: 'center', padding: '12px 0', lineHeight: 1.6 }}>
                  Límite de envíos alcanzado.<br />Intentá de nuevo más tarde.
                </Mono>
              : <button onClick={sendOtp} disabled={!canSend} style={btnStyle(canSend)}>
                  {cooldown > 0 ? `Reenviar en ${cooldown}s` : 'Enviar código'}
                </button>
            }
          </>)}

          {step === 'sending' && (
            <div style={{ textAlign: 'center', padding: '20px 0' }}>
              <Mono style={{ fontSize: 11, color: fade(T, 0.4), letterSpacing: '0.08em' }}>Enviando código···</Mono>
            </div>
          )}

          {step === 'sent' && (<>
            <Mono style={{ display: 'block', fontSize: 12, fontWeight: 700, color: T.fg, marginBottom: 6, letterSpacing: '0.04em', textTransform: 'uppercase' }}>Ingresá el código</Mono>
            <Mono style={{ display: 'block', fontSize: 11, color: fade(T, 0.58), lineHeight: 1.6, marginBottom: 18 }}>
              Código enviado a <span style={{ color: T.fg, fontWeight: 700 }}>{masked}</span>.<br />Válido por 10 minutos.
            </Mono>
            {errMsg && <Mono style={{ display: 'block', fontSize: 11, color: '#E8602C', marginBottom: 10, lineHeight: 1.5 }}>{errMsg}</Mono>}
            <input
              ref={inputRef}
              type="text" inputMode="numeric" maxLength={6}
              value={code}
              onChange={e => { setCode(e.target.value.replace(/\D/g, '').slice(0, 6)); setErrMsg(''); }}
              onKeyDown={e => e.key === 'Enter' && code.length === 6 && verify()}
              placeholder="000000"
              style={{
                width: '100%', padding: '14px 12px', boxSizing: 'border-box',
                background: fade(T, 0.04), border: `1.5px solid ${fade(T, 0.13)}`,
                borderRadius: 10, fontSize: 28, fontFamily: 'Nunito, monospace',
                fontWeight: 800, textAlign: 'center', letterSpacing: '0.35em',
                color: T.fg, outline: 'none', marginBottom: 12,
                transition: 'border-color .15s ease',
              }}
              onFocus={e => e.target.style.borderColor = '#0E6B70'}
              onBlur={e => e.target.style.borderColor = fade(T, 0.13)}
            />
            <button onClick={verify} disabled={code.length < 6} style={btnStyle(code.length === 6)}>
              Verificar →
            </button>
            <button
              onClick={() => { if (canSend) { setStep('idle'); setCode(''); setErrMsg(''); } }}
              disabled={!canSend && sends >= OTP_MAX_SENDS}
              style={{ display: 'block', width: '100%', marginTop: 10, background: 'transparent', border: 'none', padding: '8px', color: fade(T, canSend ? 0.45 : 0.25), fontFamily: 'Nunito', fontSize: 11, cursor: canSend ? 'pointer' : 'default', letterSpacing: '0.04em' }}>
              {sends >= OTP_MAX_SENDS ? 'Límite alcanzado' : cooldown > 0 ? `← Reenviar en ${cooldown}s` : '← Reenviar código'}
            </button>
          </>)}
        </div>

        <Mono style={{ display: 'block', textAlign: 'center', marginTop: 20, fontSize: 10, color: fade(T, 0.28), letterSpacing: '0.1em' }}>
          Para Ale ❤
        </Mono>
      </div>
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(() => {
    try {
      const s = JSON.parse(sessionStorage.getItem('_itAuth') || 'null');
      return !!(s && s.verified && Date.now() < s.expires);
    } catch { return false; }
  });
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const T = useMemo(() => makeTheme(t.dark), [t.dark]);
  const [active, setActive] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const scrollRef = useRef(null);

  const toggleExpand = (id) => setExpanded(e => e === id ? null : id);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTo({ top: 0 });
    setExpanded(null);
  }, [active]);

  const accent = t.accent;

  if (!authed) return <LoginScreen onAuth={() => setAuthed(true)} />;

  return (
    <div style={{ minHeight: '100vh', background: T.bg, color: T.fg, fontFamily: 'Nunito, system-ui, sans-serif', transition: 'background .3s ease, color .3s ease' }}>
      <div style={{ maxWidth: 480, margin: '0 auto' }}>
        <div ref={scrollRef}>
          {active === null ? (
            <div key="dashboard" style={{ animation: 'fadein .35s ease' }}>
              {t.showHero && <Hero accent={accent} T={T} onToggleDark={() => setTweak('dark', !t.dark)} />}
              <SectionList onOpen={setActive} accent={accent} T={T} />
              <Footer accent={accent} T={T} />
            </div>
          ) : (
            <div key={`sec-${active}`} style={{ animation: 'slidein .32s ease' }}>
              <SectionTopBar onBack={() => setActive(null)} accent={accent} T={T} current={active} />
              <SectionContent active={active} accent={accent} T={T} expanded={expanded} toggleExpand={toggleExpand} />
            </div>
          )}
        </div>
        <style>{`
          @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
          @keyframes slidein { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          * { -webkit-tap-highlight-color: transparent; }
        `}</style>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Tema">
          <TweakToggle label="Modo oscuro" value={t.dark} onChange={(v) => setTweak('dark', v)} />
        </TweakSection>
        <TweakSection label="Aspecto">
          <TweakColor label="Acento" value={t.accent} onChange={(v) => setTweak('accent', v)} options={['#0E6B70', '#D81B60', '#F0C030', '#E8602C', '#2A5298']} />
          <TweakToggle label="Mostrar hero" value={t.showHero} onChange={(v) => setTweak('showHero', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
